# Render Blueprint for Diwaan Shah Khwaan — a NEW, separate project.
# It creates its own web service and its own Postgres database. It does not touch
# any other Render service. Payments run in TEST mode (built-in demo provider) until
# the owner adds Stripe test keys, and live payments additionally need ALLOW_LIVE_PAYMENTS=true.
services:
  - type: web
    name: diwaanshahkhwaan
    runtime: node
    region: singapore # closest Render region to Perth
    plan: free # staging: sleeps when idle. Use "starter" for production so reminders and hold expiry run continuously
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render # applies migrations + idempotent seed, then starts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Builds need a bigger heap (type checking); the running server is capped at 256MB
      # in the start:render script so the free 512MB instance stays well inside its limit
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1536"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: diwaanshahkhwaan-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_PAYMENT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: demo
      - key: ALLOW_LIVE_PAYMENTS
        value: "false"
      - key: SITE_INDEXABLE
        value: "false"
      - key: IN_PROCESS_WORKER
        value: "true"
      - key: EMAIL_PROVIDER
        value: console
      - key: SMS_PROVIDER
        value: none
      - key: DATABASE_POOL_MAX
        value: "5"
      # Values you enter in the Render dashboard (Render asks for them when the blueprint is applied).
      # Leave any you don't have yet empty; see .env.example and docs/DEPLOY.md.
      - key: APP_URL # e.g. https://www.diwaan.com.au
        sync: false
      - key: SEED_OWNER_EMAIL # optional: or use "Set up the owner account" on /admin/login
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
      - key: SOCIAL_LINKS
        sync: false

databases:
  - name: diwaanshahkhwaan-db
    databaseName: diwaanshahkhwaan
    user: dsk
    region: singapore
    plan: free # staging: Render free databases expire after 30 days. Use basic-256mb for production
    postgresMajorVersion: "16"
